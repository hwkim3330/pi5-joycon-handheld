<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pi 5 + 5" Touch Display 2 + Joy-Con — 조립 가이드</title>
<style>
*{box-sizing:border-box}
:root{--bg:#0f1115;--panel:#171a21;--line:#272c36;--txt:#e7eaf0;--dim:#98a1b3;--acc:#5aa9e6;--warn:#f7b267}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
 font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif}
#app{display:flex;height:100vh;overflow:hidden}
#view{flex:1;position:relative;min-width:0}
canvas{display:block}
#hud{position:absolute;left:0;right:0;top:0;padding:14px 16px;display:flex;gap:14px;
 align-items:center;flex-wrap:wrap;background:linear-gradient(180deg,rgba(15,17,21,.92),transparent);pointer-events:none}
#hud>*{pointer-events:auto}
h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.2px}
h1 small{display:block;font-weight:400;color:var(--dim);font-size:12px;letter-spacing:0}
.ctl{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);
 border-radius:9px;padding:7px 11px;font-size:12.5px;color:var(--dim)}
input[type=range]{width:130px;accent-color:var(--acc)}
button{background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:9px;
 padding:7px 12px;font:inherit;font-size:12.5px;cursor:pointer}
button:hover{border-color:#3a4151}
button.on{background:#1d2836;border-color:var(--acc);color:#cfe6fb}
#side{width:370px;flex-shrink:0;background:var(--panel);border-left:1px solid var(--line);
 overflow-y:auto;padding:18px}
#side h2{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--dim);
 margin:22px 0 10px;font-weight:600}
#side h2:first-child{margin-top:0}
.plate{display:flex;gap:11px;align-items:center;padding:9px;border:1px solid var(--line);
 border-radius:11px;margin-bottom:7px;cursor:pointer;background:#131720}
.plate:hover{border-color:#3a4151}
.plate.sel{border-color:var(--acc);background:#16202c}
.plate svg{flex-shrink:0;width:56px;height:38px}
.plate .nm{font-weight:600;font-size:13px}
.plate .th{color:var(--dim);font-size:11.5px}
.swatch{width:9px;height:36px;border-radius:3px;flex-shrink:0}
#detail{border:1px solid var(--line);border-radius:12px;padding:14px;background:#131720}
#detail .big{width:100%;height:150px;background:#0c0f14;border-radius:8px;margin-bottom:11px}
#detail h3{margin:0 0 4px;font-size:15px}
#detail .th{color:var(--dim);font-size:12px;margin-bottom:9px}
#detail p{margin:0 0 10px}
#detail ul{margin:0;padding-left:17px;color:var(--dim);font-size:12.5px}
#detail li{margin:2px 0}
.step{border-left:2px solid var(--line);padding:0 0 14px 14px;position:relative}
.step:before{content:"";position:absolute;left:-5px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--acc)}
.step b{display:block;margin-bottom:3px}
.step p{margin:0;color:var(--dim);font-size:12.5px}
.note{border:1px solid #3a3320;background:#1d1a12;border-radius:10px;padding:12px;font-size:12.5px;color:#e8d9b8}
.note b{color:var(--warn)}
kbd{background:#0c0f14;border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-size:11.5px}
@media(max-width:860px){#app{flex-direction:column}#side{width:auto;border-left:0;border-top:1px solid var(--line)}#view{height:52vh}}
</style></head><body>
<div id="app">
  <div id="view">
    <div id="hud">
      <h1>Pi 5 · 5" Touch Display 2 · Joy-Con<small>조립 가이드 — 판을 클릭하면 어느 판인지 알려줍니다</small></h1>
      <label class="ctl">펼치기 <input type="range" id="ex" min="0" max="100" value="55"></label>
      <button id="bDisp" class="on">디스플레이</button>
      <button id="bPi" class="on">Pi 5</button>
      <button id="bJoy">조이콘</button>
      <button id="bReset">시점 초기화</button>
    </div>
  </div>
  <div id="side">
    <h2>판 6장 — 클릭해서 확인</h2>
    <div id="list"></div>
    <h2>선택한 판</h2>
    <div id="detail"></div>
    <h2>조립 순서</h2>
    <div id="steps"></div>
    <h2>조이콘 고정</h2>
    <div id="joy"></div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=s=>document.querySelector(s);
let D,scene,cam,rend,root,plateMeshes=[],sel=null,dispG,piG,joyG;

fetch('plates.json').then(r=>r.json()).then(d=>{D=d;init();buildUI();});

/* ---------- 3D ---------- */
function init(){
  const el=$('#view');
  scene=new THREE.Scene(); scene.background=new THREE.Color(0x0f1115);
  cam=new THREE.PerspectiveCamera(38,el.clientWidth/el.clientHeight,1,3000);
  rend=new THREE.WebGLRenderer({antialias:true}); rend.setPixelRatio(Math.min(devicePixelRatio,2));
  rend.setSize(el.clientWidth,el.clientHeight); el.appendChild(rend.domElement);
  scene.add(new THREE.AmbientLight(0xffffff,.62));
  const k=new THREE.DirectionalLight(0xffffff,.85); k.position.set(120,180,260); scene.add(k);
  const f=new THREE.DirectionalLight(0x93c5fd,.4); f.position.set(-180,-90,-160); scene.add(f);
  root=new THREE.Group(); scene.add(root);

  D.plates.forEach((p,i)=>{
    const sh=new THREE.Shape(p.outer.map(q=>new THREE.Vector2(q[0],q[1])));
    p.holes.forEach(h=>sh.holes.push(new THREE.Path(h.map(q=>new THREE.Vector2(q[0],q[1])))));
    const g=new THREE.ExtrudeGeometry(sh,{depth:p.thickness,bevelEnabled:false});
    const m=new THREE.MeshPhongMaterial({color:p.color,transparent:true,opacity:.52,
      shininess:70,specular:0x334455,side:THREE.DoubleSide,depthWrite:false});
    const mesh=new THREE.Mesh(g,m); mesh.userData={i}; root.add(mesh);
    const eg=new THREE.LineSegments(new THREE.EdgesGeometry(g,25),
      new THREE.LineBasicMaterial({color:0x9fb4cc,transparent:true,opacity:.34}));
    mesh.add(eg); plateMeshes.push(mesh);
  });

  const dd=D.display;
  dispG=new THREE.Group();
  dispG.add(box(dd.w,dd.h,dd.d,0x0b0d11,1,0,0,0));
  dispG.add(box(dd.frame_w,dd.frame_h,dd.frame_d,0x1b2029,1,dd.frame_dx,0,dd.d));
  root.add(dispG);
  piG=new THREE.Group();
  piG.add(box(D.pi.w,D.pi.h,1.6,0x1f6b3f,1,D.pi.dx,D.pi.dy,0));
  piG.add(box(52,40,15,0x4a5160,1,D.pi.dx-8,D.pi.dy+3,1.6));
  piG.add(box(18,50,16,0xaab2bd,1,D.pi.dx+D.pi.w/2-9,D.pi.dy,1.6));
  root.add(piG);
  joyG=new THREE.Group();
  [-1,1].forEach(s=>{
    const head=box(D.guide.head,D.guide.length,2.4,0xc8ccd4,1,0,0,0);
    head.position.set(s*(D.W/2-D.guide.depth+1.2),D.H/2-D.guide.length/2-2,0);
    head.rotation.y=Math.PI/2; joyG.add(head);
    const body=box(34,D.guide.length+16,14,0x8f96a3,1,0,0,0);
    body.position.set(s*(D.W/2+17),D.H/2-D.guide.length/2-2,5);
    joyG.add(body);
  });
  joyG.visible=false; root.add(joyG);

  orbit(rend.domElement); resetView(); layout();
  addEventListener('resize',()=>{const e=$('#view');cam.aspect=e.clientWidth/e.clientHeight;
    cam.updateProjectionMatrix();rend.setSize(e.clientWidth,e.clientHeight);});
  rend.domElement.addEventListener('click',pick);
  (function loop(){requestAnimationFrame(loop);rend.render(scene,cam);})();
}
function box(w,h,d,c,o,x,y,z){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),
    new THREE.MeshPhongMaterial({color:c,transparent:o<1,opacity:o,shininess:40}));
  m.position.set(x||0,y||0,(z||0)+d/2); return m;
}
function layout(){
  const gap=+$('#ex').value/100*26;
  plateMeshes.forEach((m,i)=>m.position.z=D.plates[i].z+i*gap);
  const ft=D.plates[0].thickness, dd=D.display;
  dispG.position.z=ft+gap*0.9;
  piG.position.z=ft+dd.d+dd.frame_d+D.pi.standoff+gap*5.6;
  joyG.position.z=D.plates[1].z+gap*1;
}
function resetView(){cam.position.set(-210,-150,330);cam.lookAt(0,0,D.total/2);
  root.rotation.set(0,0,0);rot={x:-0.42,y:-0.55};applyRot();}
let rot={x:-0.42,y:-0.55},dist=430;
function applyRot(){
  const r=dist;
  cam.position.set(r*Math.sin(rot.y)*Math.cos(rot.x), r*Math.sin(rot.x), r*Math.cos(rot.y)*Math.cos(rot.x));
  cam.lookAt(0,0,D.total/2);
}
function orbit(el){
  let down=false,px=0,py=0;
  el.addEventListener('pointerdown',e=>{down=true;px=e.clientX;py=e.clientY;el.setPointerCapture(e.pointerId);});
  el.addEventListener('pointerup',e=>{down=false;});
  el.addEventListener('pointermove',e=>{if(!down)return;
    rot.y-=(e.clientX-px)*.008; rot.x=Math.max(-1.45,Math.min(1.45,rot.x+(e.clientY-py)*.008));
    px=e.clientX;py=e.clientY;applyRot();});
  el.addEventListener('wheel',e=>{e.preventDefault();
    dist=Math.max(160,Math.min(950,dist*(1+Math.sign(e.deltaY)*.12)));applyRot();},{passive:false});
}
const ray=new THREE.Raycaster(),m2=new THREE.Vector2();
function pick(e){
  const r=rend.domElement.getBoundingClientRect();
  m2.x=((e.clientX-r.left)/r.width)*2-1; m2.y=-((e.clientY-r.top)/r.height)*2+1;
  ray.setFromCamera(m2,cam);
  const hit=ray.intersectObjects(plateMeshes,false);
  if(hit.length) select(hit[0].object.userData.i);
}
function select(i){
  sel=i;
  plateMeshes.forEach((m,j)=>{m.material.opacity=(i===null||j===i)?.62:.16;});
  document.querySelectorAll('.plate').forEach((n,j)=>n.classList.toggle('sel',j===i));
  detail(i);
}

/* ---------- 2D 실루엣 ---------- */
function svgOf(p,w,h,stroke){
  const pts=a=>a.map((q,k)=>(k?'L':'M')+q[0].toFixed(1)+' '+(-q[1]).toFixed(1)).join('')+'Z';
  let d=pts(p.outer)+p.holes.map(pts).join('');
  return `<svg viewBox="${-D.W/2-3} ${-D.H/2-3} ${D.W+6} ${D.H+6}" width="${w}" height="${h}">
    <path d="${d}" fill="${p.color}" fill-opacity=".26" fill-rule="evenodd"
      stroke="${stroke||p.color}" stroke-width="1.3"/></svg>`;
}

/* ---------- UI ---------- */
function buildUI(){
  $('#list').innerHTML=D.plates.map((p,i)=>`
    <div class="plate" data-i="${i}">
      <div class="swatch" style="background:${p.color}"></div>
      ${svgOf(p,56,38)}
      <div><div class="nm">${p.title}</div><div class="th">${p.thickness}T · 순서 ${i+1}번째</div></div>
    </div>`).join('');
  document.querySelectorAll('.plate').forEach(n=>n.onclick=()=>select(+n.dataset.i));

  $('#steps').innerHTML=[
    ["보호필름 제거","6장 모두 <b>양면</b> 다 벗깁니다."],
    ["방향 맞추기","L2~L5의 작은 캐비티는 한쪽으로 <b>3.47mm 치우쳐</b> 있습니다. 겹쳐 놓고 모서리가 일치하는지 먼저 확인하세요."],
    ["가조립","앞판·디스플레이 없이 L5→L1만 볼트로 꿰어 옆 홈이 <b>하나의 곧은 채널</b>(11mm)이 되는지 봅니다."],
    ["개스킷","L2 앞면 캐비티 둘레에 얇은 폼테이프/실리콘(약 4mm 폭)을 링으로 깝니다. 유리 뒤 1.3mm 틈을 메워 덜그럭거림을 막습니다."],
    ["디스플레이","<b>L1 포켓에 유리를 떨어뜨려 넣습니다.</b> 평판 사이에 끼우는 게 아닙니다. 뒷쪽 프레임은 L2~L5 캐비티를 통과합니다."],
    ["앞판","창이 화면 위에 오는지 확인. 창은 일부러 <b>2.47mm 비대칭</b>입니다(패널이 치우쳐 있음)."],
    ["볼트",`앞에서 M2.5×${D.bolt.length}, 뒤에서 와셔+너트. <b>대각선 순서로 살짝만</b> — 삐걱대면 이미 과조임.`],
    ["Pi 5","디스플레이 상자에 들어있던 <b>M2.5 나사 4개</b>로 디스플레이 뒷면 스탠드오프에 직결. 케이스 볼트와 다른 나사입니다. FFC 22→15핀, J1→GPIO 2·6번."],
  ].map(([t,p])=>`<div class="step"><b>${t}</b><p>${p}</p></div>`).join('');

  const g=D.guide;
  $('#joy').innerHTML=`
    <div class="note"><b>홈은 끼워주기만 하고 잠그지는 않습니다.</b><br>
      조이콘 레일 머리 ${g.head}mm &lt; 홈 입구 ${g.channel}mm 라서 바깥으로 당기면 빠집니다.
      깊이(${g.depth}mm)와 폭은 충분해서 <b>끼워 넣고 미끄러뜨리는 건 잘 됩니다.</b></div>
    <div class="step"><b>테이프 립 (선택한 방법)</b><p>
      각 홈의 <b>앞쪽 가장자리와 뒤쪽 가장자리</b>에 투명 테이프를 붙여
      <b>${g.overhang}mm씩 홈 위로 걸치게</b> 합니다. 입구가 ${g.channel} → 약 ${g.mouth_target}mm로 좁아져
      머리(${g.head}mm)가 걸립니다. 테이프 길이는 홈 길이에 맞춰 <b>약 100mm</b>.</p></div>
    <div class="step"><b>붙일 곳</b><p>
      앞쪽: 앞판 옆면(홈 없는 2mm 띠)에 붙여 뒤로 ${g.overhang}mm 내밀기.
      뒤쪽: L5 뒷면에 붙여 앞으로 ${g.overhang}mm 내밀기. 모서리를 감싸 붙이면 접착 면적이 늘어 잘 버팁니다.</p></div>
    <div class="step"><b>주의</b><p>
      <b>홈 바닥에는 붙이지 마세요.</b> 깊이 여유가 0.3mm뿐이라 조이콘이 안 들어갑니다.
      얇은 투명 PET/포장용 테이프(0.1mm 이하)를 쓰고, 천·덕트 테이프는 두꺼워서 안 됩니다.</p></div>`;
  select(0);
}
function detail(i){
  const p=D.plates[i];
  $('#detail').innerHTML=`<div class="big">${svgOf(p,'100%','150','#cfe0f0')}</div>
    <h3>${p.title}</h3><div class="th">${p.thickness} mm · 앞에서 ${i+1}번째</div>
    <p>${p.how}</p><ul>${p.bullets.map(b=>`<li>${b}</li>`).join('')}</ul>`;
}
$('#ex').oninput=layout;
$('#bReset').onclick=resetView;
const tog=(id,o)=>{const b=$(id);b.onclick=()=>{o().visible=!o().visible;b.classList.toggle('on',o().visible);};};
tog('#bDisp',()=>dispG); tog('#bPi',()=>piG); tog('#bJoy',()=>joyG);
</script></body></html>
